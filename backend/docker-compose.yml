version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - RUNNING_IN_DOCKER=1
      - APP_ENV=test
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - oracle-test

  oracle-test:
    image: gvenzl/oracle-free:slim-faststart
    environment:
      - ORACLE_PASSWORD=oracle
      - APP_USER=test_schema
      - APP_USER_PASSWORD=oracle
    ports:
      - "1521:1521"
    volumes:
      - ./init-scripts:/container-entrypoint-initdb.d
