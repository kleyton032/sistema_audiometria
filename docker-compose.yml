services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sistema-audiometria-backend
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    env_file:
      - ./backend/.env
    environment:
      - RUNNING_IN_DOCKER=1
    restart: unless-stopped
    networks:
      - audiometria-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Caminho vazio faz o Axios usar "/api/v1" relativo, roteado pelo proxy reverso do Nginx
        VITE_API_URL: ""
    container_name: sistema-audiometria-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    environment:
      - BACKEND_UPSTREAM=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - audiometria-net

networks:
  audiometria-net:
    driver: bridge
